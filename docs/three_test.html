<script>
/* R1172.9.11-DIAG — VISIBLE THREE.JS STARTUP ERROR DETAIL */
(function () {
  function showStartupError(message, details) {
    var el = document.getElementById("simviewStatus") ||
             document.getElementById("status");
    if (!el) return;
    el.textContent = "Three.js startup error: " + message +
      (details ? "\n\n" + details : "");
    el.style.whiteSpace = "pre-wrap";
    el.style.overflowWrap = "anywhere";
    el.style.maxHeight = "260px";
    el.style.overflowY = "auto";
    el.style.color = "#b00020";
    el.style.background = "transparent";
    el.style.border = "0";
  }
  window.addEventListener("error", function (event) {
    var error = event && event.error;
    var msg = (error && error.message) ||
              (event && event.message) || "Unknown JavaScript error";
    var details = [
      "File: " + ((event && event.filename) || "unknown"),
      "Line: " + ((event && event.lineno) || "unknown"),
      "Column: " + ((event && event.colno) || "unknown"),
      error && error.stack ? "Stack:\n" + error.stack : "Stack: unavailable"
    ].join("\n");
    showStartupError(msg, details);
  });
  window.addEventListener("unhandledrejection", function (event) {
    var reason = event && event.reason;

})();

        pose[1][2],
        pose[1][1],

    for(let i = 0; i < 11; i++){

    // 0 and 112, eliminating the previous midpoint/origin offset.
    // --------------------------------------------------------

    for(const child of group.children){

        child.position.y =
            73 - child.position.y;

    }

    return group;

}

function updateStrutAssembly(object, p1, p2){

    const start = simPointToThree(p1);
    const end = simPointToThree(p2);

    const direction = new THREE.Vector3()
        .subVectors(end, start);

    const length = direction.length();

    // Test 56 graphical strut contract:
    //
    //   local y = 0   -> proximal hinge / colored marker side
    //   local y = 112 -> distal hinge
    //
    // Position at the proximal attachment, not the midpoint.
    // This removes the local-origin offset that caused the
    // complete graphical strut to appear shifted.
    object.position.copy(start);

    object.scale.set(
        1,
        length / GRAPHICAL_STRUT_BASE_LENGTH,
        1
    );

    object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
    );

}


// ============================================================
// TEST 79 — HEX BOLT / VARIABLE SCREW / CONFIGURABLE BARREL
//
// The ring is centered on its zero plane.
// Ring thickness = 8 mm  -> faces at +/-4 mm.
// Strut mounting offset = 17 mm.
// Therefore the face-to-strut connector space is 13 mm.
//
// Connector diameter = 10 mm, matching the measured ring-hole
// diameter.  The connector is attached to the physical ring
// face and reaches the existing SimulationFrameV1 strut end.
//
// Distal holes are selected from the CURRENT displayed distal
// ring pose by projecting each strut endpoint back into the
// displayed ring's local coordinates.  This guarantees that the
// connector goes to the hole directly beneath its strut end,
// rather than to the hole having the same unrotated angle as the
// proximal ring.
// ============================================================
const CONNECTOR_FACE = 4.0;
const CONNECTOR_MOUNT = 17.0;
const CONNECTOR_DIAMETER = 10.0;
const PROX_CONNECTOR_ANGLES = [97.5,82.5,337.5,322.5,217.5,202.5];

function makeHoleConnector(){
    const g = new THREE.Group();

    const mat = new THREE.MeshStandardMaterial({
        color:'#202020',
        roughness:0.35,
        metalness:0.65
    });

    const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(
            CONNECTOR_DIAMETER/2,
            CONNECTOR_DIAMETER/2,
            1,
            24
        ),
        mat
    );

    shaft.userData.connectorShaft = true;
    g.add(shaft);

    // Hex-head bolt is deliberately slightly larger than the
    // measured 10 mm ring hole so it visibly covers the hole.
    const boltMaterial = new THREE.MeshStandardMaterial({
        // Match the existing strut screw/thread silver.
        color: '#B8BEC5',
        roughness: 0.24,
        metalness: 0.88
    });

    const boltHead = new THREE.Mesh(
        new THREE.CylinderGeometry(
            6.5,
            6.5,
            4.0,
            6
        ),
        boltMaterial
    );

    g.add(boltHead);

    g.userData.shaft = shaft;
    g.userData.boltHead = boltHead;
    return g;
}

function updateHoleConnector(g, strutPoint, ringFacePoint, ringMatrix, outwardSign){
    const a = simPointToThree(strutPoint);
    const b = ringFacePoint.clone();
    const d = new THREE.Vector3().subVectors(a,b);
    const len = d.length();

    g.position.copy(a).add(b).multiplyScalar(0.5);
    g.quaternion.setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        d.normalize()
    );
    g.scale.set(1,1,1);
    g.userData.shaft.scale.set(1,len,1);
    g.userData.shaft.position.set(0,0,0);

    // The bolt head axis follows the ring normal, not the strut axis.
    // The bolt head is deliberately placed on the RING SIDE OPPOSITE
    // the strut.  The ring is centered on its zero plane: 4 mm to
    // either face.  The connector/strut is on `outwardSign`; the
    // bolt therefore sits on the opposite face, with 2 mm of head
    // projection beyond that face.
    const ringNormal = new THREE.Vector3(0,1,0)
        .transformDirection(ringMatrix)
        .normalize()
        .multiplyScalar(outwardSign);

    // Convert the desired bolt center from world coordinates into
    // the connector group's LOCAL coordinates.  Test 79 only
    // subtracted the group position; that is insufficient because
    // the connector group is rotated along the strut direction.
    // The bolt therefore ended up away from the ring hole.
    const ringThickness = Number(ringSpec.ringThickness || 8.0);

    // `b` is the strut-side ring face.  Move across the complete
    // ring thickness, then 2 mm outward on the opposite side.
    const boltWorldPos =
        b.clone().add(
            ringNormal.clone().multiplyScalar(-(ringThickness + 2.0))
        );

    const boltLocalPos =
        boltWorldPos
            .sub(g.position)
            .applyQuaternion(
                g.quaternion.clone().invert()
            );

    g.userData.boltHead.position.copy(
        boltLocalPos
    );

    const desiredWorldQuat = new THREE.Quaternion()
        .setFromUnitVectors(
            new THREE.Vector3(0,1,0),
            ringNormal.clone().multiplyScalar(-1).normalize()
        );

    const localQuat =
        g.quaternion.clone().invert()
            .multiply(desiredWorldQuat);

    g.userData.boltHead.quaternion.copy(
        localQuat
    );
}

function getRingFacePoint(ringMatrix, angleDeg, faceY){
    const a = THREE.MathUtils.degToRad(angleDeg);
    return new THREE.Vector3(
        Number(ringSpec.tabHoleCenterRadius)*Math.cos(a),
        faceY,
        Number(ringSpec.tabHoleCenterRadius)*Math.sin(a)
    ).applyMatrix4(ringMatrix);
}

function getDisplayedRingHoleAngle(strutPoint, displayedRingMatrix, localRotation){
    const p = simPointToThree(strutPoint);
    const displayed = new THREE.Matrix4()
        .multiplyMatrices(displayedRingMatrix, localRotation);
    const inv = displayed.clone().invert();
    const local = p.clone().applyMatrix4(inv);
    return THREE.MathUtils.radToDeg(Math.atan2(local.z, local.x));
}

function nearestTabHoleAngle(angleDeg){
    // Physical standard/master tab holes are at the measured
    // 7.5-degree spacing.  The six strut positions use the
    // specific tab-hole locations below.
    const candidates = [
        97.5,82.5,337.5,322.5,217.5,202.5,
        142.5,37.5,22.5,277.5,262.5,157.5
    ];
    let best = candidates[0];
    let bestErr = Infinity;
    for(const c of candidates){
        let e = Math.abs(((angleDeg-c+540)%360)-180);
        if(e < bestErr){ bestErr=e; best=c; }
    }
    return best;
}

const proximalConnectorObjects=[];
const distalConnectorObjects=[];
for(let i=0;i<6;i++){

    const d=makeHoleConnector();
    frameGroup.add(p);
    frameGroup.add(d);
    proximalConnectorObjects.push(p);
    distalConnectorObjects.push(d);
}

function makeRing(
    ringSpec,
    isProximal
){

    // Test 58:
    // measured ring parameters are consumed from
    // frameContract.static.ring.

    const innerRadius =
        Number(ringSpec.innerOpeningRadius);

    const holeDiameter =
        Number(ringSpec.innerHoleDiameter);

    const holeRadius =
        holeDiameter / 2;

    const holeCount =
        Number(ringSpec.innerHoleCount);

    const holeSpacingDeg =
        Number(ringSpec.innerHoleSpacingDeg);

    const holeCenterRadius =
        Number(ringSpec.innerHoleCenterRadius);

    // Tab-hole DIAMETER is intentionally identical to the
    // 48 standard ring holes.  The tabHoleCenterRadius remains
    // the radial LOCATION of the tab-hole centres.
    const tabHoleDiameter =
        holeDiameter;

    const tabHoleRadius =
        tabHoleDiameter / 2;

    const tabHoleCenterRadius =
        Number(ringSpec.tabHoleCenterRadius);

    const outerRadius =
        Number(ringSpec.outerRadius);

    const thickness = Number(ringSpec.ringThickness);

    // --------------------------------------------------------
    // Main ring: 90 mm opening, 48 actual 10 mm holes,
    // centres at 99 mm radius, 7.5 degree spacing.
    // --------------------------------------------------------

    const shape =
        new THREE.Shape();

    shape.absarc(
        0, 0,
        outerRadius,
        0, Math.PI * 2,
        false
    );

    const opening =
        new THREE.Path();

    opening.absarc(
        0, 0,
        innerRadius,
        0, Math.PI * 2,
        true
    );

    shape.holes.push(opening);

    for(
        let i = 0;
        i < holeCount;
        i++
    ){

        const a =
            THREE.MathUtils.degToRad(
                i * holeSpacingDeg
            );

        const hole =
            new THREE.Path();

        hole.absarc(
            Math.cos(a) * holeCenterRadius,
            Math.sin(a) * holeCenterRadius,
            holeRadius,
            0, Math.PI * 2,
            true
        );

        shape.holes.push(hole);

    }

    // The tabs overlap the outer edge of the main ring by design.
    // Therefore the tab holes must also be cut through the main ring
    // wherever the 10 mm tab holes overlap that ring.  Otherwise the
    // underlying ring material partially closes the tab holes.
    const mainRingTabAngles = [];
    const tabCenterAnglesDeg = [90,210,330];

    for(let tabIndex = 0; tabIndex < tabCenterAnglesDeg.length; tabIndex++){
        const isMasterTab = isProximal && tabIndex === 0;
        const count = isMasterTab
            ? Number(ringSpec.masterTabHoleCount)
            : Number(ringSpec.standardTabHoleCount);
        const spacingDeg = isMasterTab
            ? Number(ringSpec.masterTabHoleSpacingDeg)
            : Number(ringSpec.standardTabHoleSpacingDeg);

        for(let i = 0; i < count; i++){
            mainRingTabAngles.push(
                tabCenterAnglesDeg[tabIndex] +
                (i - (count - 1) / 2) * spacingDeg
            );
        }
    }

    for(const deg of mainRingTabAngles){
        const a = THREE.MathUtils.degToRad(deg);
        const hole = new THREE.Path();
        hole.absarc(
            Math.cos(a) * tabHoleCenterRadius,
            Math.sin(a) * tabHoleCenterRadius,
            tabHoleRadius,
            0, Math.PI * 2,
            true
        );
        shape.holes.push(hole);
    }

    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth: thickness,
                bevelEnabled: true,
                bevelSegments: 2,
                bevelSize: 0.65,
                bevelThickness: 0.55,
                curveSegments: 64,
                steps: 1
            }
        );

    geometry.rotateX(Math.PI / 2);
    geometry.translate(0, +thickness / 2, 0);

    const ringMaterial =
        new THREE.MeshStandardMaterial({
            color: "#173B63",
            roughness: 0.38,
            metalness: 0.58
        });

    const edgeMaterial =
        new THREE.MeshStandardMaterial({
            color: "#234E78",
            roughness: 0.34,
            metalness: 0.62
        });

    const group =
        new THREE.Group();

    group.add(
        new THREE.Mesh(
            geometry,
            ringMaterial
        )
    );


    // --------------------------------------------------------
    // Three tab locations.
    // Anterior/master tab is +Three Z.
    // The other two are 120 degrees apart.
    // --------------------------------------------------------

    const masterAngle = Math.PI / 2;

    const tabAngles = [
        masterAngle,
        masterAngle + (2 * Math.PI / 3),
        masterAngle + (4 * Math.PI / 3)
    ];

    const tabHoleCountStandard =
        Number(
            ringSpec.standardTabHoleCount
        );

    const tabHoleCountMaster =
        Number(
            ringSpec.masterTabHoleCount
        );

    const tabSpacingStandard =
        THREE.MathUtils.degToRad(
            Number(
                ringSpec.standardTabHoleSpacingDeg
            )
        );

    const tabSpacingMaster =
        THREE.MathUtils.degToRad(
            Number(
                ringSpec.masterTabHoleSpacingDeg
            )
        );

    const tabThickness = 7.0;

    function addTab(
        angle,
        isMaster
    ){

        const count =
            isMaster
                ? Number(ringSpec.masterTabHoleCount)
                : Number(ringSpec.standardTabHoleCount);

        const spacing =
            THREE.MathUtils.degToRad(
                isMaster
                    ? Number(ringSpec.masterTabHoleSpacingDeg)
                    : Number(ringSpec.standardTabHoleSpacingDeg)
            );

        const offsets = [];

        for(let i = 0; i < count; i++){
            offsets.push(
                (i - (count - 1) / 2) * spacing
            );
        }

        const radialInner = outerRadius - 2.0;
        const radialOuter = Number(ringSpec.tabOuterEdgeRadius);

        const maxHoleAngle =
            Math.max(...offsets.map(da => Math.abs(da)));

        // Small angular margin around the end holes.
        const halfSectorAngle =
            maxHoleAngle +
            THREE.MathUtils.degToRad(5.0);

        const startAngle = angle - halfSectorAngle;
        const endAngle = angle + halfSectorAngle;

        // ----------------------------------------------------
        // Tab shape.
        //
        // Only the TWO OUTER / POINTED corners are filleted.
        // The two ring-side corners remain genuinely sharp.
        //
        // Test 65 uses a 7.5 mm corner radius, within the
        // 5-10 mm physical range previously established.
        // The fillet is made by replacing each outer corner
        // with an inward quadratic transition.  No extrusion
        // bevel is used, because beveling also rounded the
        // ring-side corners.
        // ----------------------------------------------------

        const cornerRadius = 7.5;
        const outerCornerAngle =
            cornerRadius / radialOuter;

        const tabShape = new THREE.Shape();
        const arcSegments = 40;

        // Sharp ring-adjacent START corner.
        tabShape.moveTo(
            Math.cos(startAngle) * radialInner,
            Math.sin(startAngle) * radialInner
        );

        // Inner circular edge to the END ring-side corner.
        for(let i = 0; i <= arcSegments; i++){
            const a =
                startAngle +
                (endAngle - startAngle) * i / arcSegments;

            tabShape.lineTo(
                Math.cos(a) * radialInner,
                Math.sin(a) * radialInner
            );
        }

        // END radial side stops short of the outer corner.
        const endSidePoint = new THREE.Vector2(
            Math.cos(endAngle) * (radialOuter - cornerRadius),
            Math.sin(endAngle) * (radialOuter - cornerRadius)
        );

        tabShape.lineTo(
            endSidePoint.x,
            endSidePoint.y
        );

        // Inward fillet at the END pointed corner.
        // Control point is the actual sharp corner; the curve
        // remains inside the original tab boundary.
        const endOuterPoint = new THREE.Vector2(
            Math.cos(endAngle - outerCornerAngle) * radialOuter,
            Math.sin(endAngle - outerCornerAngle) * radialOuter
        );

        tabShape.quadraticCurveTo(
            Math.cos(endAngle) * radialOuter,
            Math.sin(endAngle) * radialOuter,
            endOuterPoint.x,
            endOuterPoint.y
        );

        // Outer circular edge between the two fillets.
        for(let i = 0; i <= arcSegments; i++){
            const a =
                (endAngle - outerCornerAngle) -
                ((endAngle - outerCornerAngle) -
                 (startAngle + outerCornerAngle)) * i / arcSegments;

            tabShape.lineTo(
                Math.cos(a) * radialOuter,
                Math.sin(a) * radialOuter
            );
        }

        // Inward fillet at the START pointed corner.
        const startOuterPoint = new THREE.Vector2(
            Math.cos(startAngle + outerCornerAngle) * radialOuter,
            Math.sin(startAngle + outerCornerAngle) * radialOuter
        );

        tabShape.quadraticCurveTo(
            Math.cos(startAngle) * radialOuter,
            Math.sin(startAngle) * radialOuter,
            Math.cos(startAngle) * (radialOuter - cornerRadius),
            Math.sin(startAngle) * (radialOuter - cornerRadius)
        );

        // Sharp ring-adjacent START corner closes the tab.
        tabShape.lineTo(
            Math.cos(startAngle) * radialInner,
            Math.sin(startAngle) * radialInner
        );

        tabShape.closePath();

        // ----------------------------------------------------
        // Tab holes.
        // No decorative torus/washer rings are added around
        // these holes.  The physical holes themselves remain.
        // ----------------------------------------------------

        for(const da of offsets){

            const a = angle + da;

            const hole = new THREE.Path();

            // Hole CENTER follows the tab-hole radial location.
            // The radius of the hole itself remains 5 mm.
            hole.absarc(
                Math.cos(a) * tabHoleCenterRadius,
                Math.sin(a) * tabHoleCenterRadius,
                tabHoleRadius,
                0,
                Math.PI * 2,
                true
            );

            tabShape.holes.push(hole);
        }

        const tabGeometry =
            new THREE.ExtrudeGeometry(
                tabShape,
                {
                    depth: Number(ringSpec.ringThickness),
                    bevelEnabled: true,
                    bevelSegments: 2,
                    bevelSize: 0.65,
                    bevelThickness: 0.55,
                    curveSegments: 64,
                    steps: 1
                }
            );

        tabGeometry.rotateX(Math.PI / 2);

        tabGeometry.translate(
            0,
            +Number(ringSpec.ringThickness) / 2,
            0
        );

        group.add(
            new THREE.Mesh(
                tabGeometry,
                ringMaterial
            )
        );
    }

    for(let i = 0; i < tabAngles.length; i++){

        const isMaster =
            isProximal && i === 0;

        addTab(
            tabAngles[i],
            isMaster
        );
    }

    // No additional thin circular rings are drawn here.
    // The ring itself and its physical holes are the only
    // circular hardware geometry in this presentation test.

    return group;

}

const strutNumberSprites = [];

function makeStrutNumberSprite(number, color){

    const canvas = document.createElement("canvas");
    canvas.width = 128;
    canvas.height = 128;

    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, 128, 128);

    ctx.beginPath();
    ctx.arc(64, 64, 46, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(20,20,20,0.92)";
    ctx.fill();
    ctx.lineWidth = 8;
    ctx.strokeStyle = color;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 58px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(number), 64, 65);

    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;

    const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: false,
        depthWrite: false
    });

    const sprite = new THREE.Sprite(material);
    sprite.scale.set(18, 18, 1);
    sprite.renderOrder = 1100;

    modelPanGroup.add(sprite);
    strutNumberSprites.push(sprite);

}

for(let i = 0; i < 6; i++){
    makeStrutNumberSprite(i + 1, STRUT_COLORS[i]);
}

function updateStrutNumberSprites(frame){

    for(let i = 0; i < 6; i++){

        const p1 = simPointToThree(frame.struts[i].proximal);
        const p2 = simPointToThree(frame.struts[i].distal);

        const midpoint = p1.clone().add(p2).multiplyScalar(0.5);

        // Small upward presentation offset so the number does not
        // sit directly on top of the strut barrel.
        midpoint.y += 11;

        strutNumberSprites[i].position.copy(midpoint);

    }

}

// ============================================================
// TEST 26 — ANATOMICAL REPLACEMENT CANDIDATE
//
// Mechanical simulation baseline is unchanged.
// The anatomical group is separate from frameGroup.
//
// Registration:
//   1. RIGHT side only: BodyParts3D X < 0.
//   2. Tibia alone determines longitudinal axis.
//   3. Tibial centerline is aligned with simulation +Z,
//      which is Three.js +Y after the existing renderer
//      coordinate conversion.
//   4. A temporary cut point is selected where the tibial
//      centerline intersects native Z = 180 mm.
//   5. The cut plane is perpendicular to that tibial axis.

const ANATOMY_REFERENCE_Z = 180.0;

function decodeSTLBase64(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return bytes.buffer;
}

const anatomyLoader = new STLLoader();

const tibiaSource =
    anatomyLoader.parse(
        decodeSTLBase64(RIGHT_TIBIA_B64)
    );

const fibulaSource =
    anatomyLoader.parse(
        decodeSTLBase64(RIGHT_FIBULA_B64)
    );

function getRightPoints(geometry){
    const g = geometry.index
        ? geometry.toNonIndexed()
        : geometry;

    const p = g.attributes.position;
    const pts = [];

    for(let i=0;i<p.count;i++){
        if(p.getX(i) < 0){
            pts.push(
                new THREE.Vector3(
                    p.getX(i),
                    p.getY(i),
                    p.getZ(i)
                )
            );
        }
    }

    return pts;
}

// ------------------------------------------------------------
// ------------------------------------------------------------
// TEST 50 — TWO-POINT TIBIAL ANATOMICAL AXIS
//
// Clinical reference checked for this test:
// the tibial anatomical axis is commonly represented by a line
// joining two points centered in the tibial diaphysis. One
// published lower-limb measurement guide describes the points as
// being midway between the cortical surfaces and about 10 cm from
// the nearest joint. Other deformity-planning references likewise
// describe the tibial anatomical axis as the line joining two
// diaphyseal midpoints.
//
// Test definition for this 3-D model:
//   1. Use RIGHT tibia only: BodyParts3D X < 0.
//   2. Find one shaft-center point 100 mm inward from the proximal
//      end of the tibial model.
//   3. Find the second shaft-center point 100 mm inward from the
//      distal end of the tibial model.
//   4. The two points are calculated BEFORE the bone is split.
//   5. The line through these two points is the tibial anatomical
//      axis used for registration of BOTH proximal and distal bone.
//   6. The existing reference/cut level remains native Z=180 mm.
//   7. The cut plane is perpendicular to this two-point line.
//
// This is an implementation test of the two-point anatomical-axis
// concept. The exact 100 mm locations are deliberately exposed as
// test parameters because the 3-D model does not provide a clinical
// joint-line landmark.
// ------------------------------------------------------------

const tibiaRightPoints = getRightPoints(tibiaSource);

if(tibiaRightPoints.length < 20)
    throw new Error("Insufficient right tibia points for Test 31");

let tibiaZMin = Infinity;
let tibiaZMax = -Infinity;

for(const p of tibiaRightPoints){
    tibiaZMin = Math.min(tibiaZMin,p.z);
    tibiaZMax = Math.max(tibiaZMax,p.z);
}

const tibiaZSpan = tibiaZMax - tibiaZMin;

// Literature-inspired test placement: approximately 10 cm from
// the nearest joint.  The actual mesh has no explicit joint-line
// landmark, so the model extrema are used as the provisional ends.
const ANATOMICAL_POINT_INSET_MM = 100;
const PROX_AXIS_Z = tibiaZMin + ANATOMICAL_POINT_INSET_MM;
const DIST_AXIS_Z = tibiaZMax - ANATOMICAL_POINT_INSET_MM;
const AXIS_POINT_HALF_THICKNESS = Math.max(1.5,tibiaZSpan*0.012);

// ============================================================
// TEST 50 — TRUE TRIANGLE/PLANE DIAPHYSEAL CENTERS
// ============================================================
//
// The previous tests selected STL vertices inside a Z slab.
// That does NOT guarantee that the reported extrema belong to
// the actual cortical intersection with the section plane.
//
// Test 50 changes only that geometric definition:
//   1. keep the same two longitudinal locations (100 mm from
//      the model ends),
//   2. intersect the actual STL triangles with the section plane,
//   3. find left/right and front/back extrema on that intersection,
//   4. take their midpoints as the two anatomical-axis points.
//
// The existing simulation animation, cut, and renderer are not
// changed. The anatomical registration is rebuilt from these new
// section-center points.
// ============================================================

function getRightTriangles(geometry){
    const g = geometry.index ? geometry.toNonIndexed() : geometry;
    const p = g.attributes.position;
    const tris=[];

    for(let i=0;i<p.count;i+=3){
        const a=new THREE.Vector3(p.getX(i),   p.getY(i),   p.getZ(i));
        const b=new THREE.Vector3(p.getX(i+1), p.getY(i+1), p.getZ(i+1));
        const c=new THREE.Vector3(p.getX(i+2), p.getY(i+2), p.getZ(i+2));

        // Keep the same right-side convention used by the anatomy.
        if((a.x+b.x+c.x)/3 < 0)
            tris.push([a,b,c]);
    }
    return tris;
}

const tibiaRightTriangles = getRightTriangles(tibiaSource);

if(tibiaRightTriangles.length < 20)
    throw new Error("Insufficient right tibia triangles for Test 50");

function intersectTriangleWithZPlane(tri,zLevel){
    const hits=[];
    const eps=1e-9;

    for(let e=0;e<3;e++){
        const A=tri[e];
        const B=tri[(e+1)%3];
        const da=A.z-zLevel;
        const db=B.z-zLevel;

        if(Math.abs(da)<=eps && Math.abs(db)<=eps){
            hits.push(A.clone(),B.clone());
        }else if(Math.abs(da)<=eps){
            hits.push(A.clone());
        }else if(Math.abs(db)<=eps){
            hits.push(B.clone());
        }else if(da*db<0){
            const t=da/(da-db);
            hits.push(A.clone().lerp(B,t));
        }
    }

    // Deduplicate the three possible edge hits of one triangle.
    const unique=[];
    for(const q of hits){
        if(!unique.some(r=>r.distanceToSquared(q)<1e-12))
            unique.push(q);
    }
    return unique;
}

function trueNativeSectionAtZ(zLevel){
    const section=[];

    for(const tri of tibiaRightTriangles){
        for(const q of intersectTriangleWithZPlane(tri,zLevel))
            section.push(q);
    }

    if(section.length<3)
        throw new Error("Insufficient true tibial section intersections at Z="+zLevel);

    let minX=Infinity,maxX=-Infinity;
    let minY=Infinity,maxY=-Infinity;

    for(const p of section){
        minX=Math.min(minX,p.x);
        maxX=Math.max(maxX,p.x);
        minY=Math.min(minY,p.y);
        maxY=Math.max(maxY,p.y);
    }

    return {
        point:new THREE.Vector3(
            (minX+maxX)/2,
            (minY+maxY)/2,
            zLevel
        ),
        minX,maxX,minY,maxY,
        count:section.length
    };
}

function clipPolygonY(poly, keepProximal){
    const out=[];

    for(let i=0;i<poly.length;i++){
        const A=poly[i];
        const B=poly[(i+1)%poly.length];

        const inA =
            keepProximal
                ? A.y >= 0
                : A.y <= 0;

        const inB =
            keepProximal
                ? B.y >= 0
                : B.y <= 0;

        if(inA)
            out.push(A.clone());

        if(inA !== inB){
            const denom=B.y-A.y;

            if(Math.abs(denom)>1e-12){
                const t=-A.y/denom;
                out.push(
                    A.clone().lerp(B,t)
                );
            }
        }
    }

    return out;
}

function clipAnatomy(
    source,
    keepProximal
){
    const g =
        source.index
            ? source.toNonIndexed()
            : source;

    const p=g.attributes.position;
    const vertices=[];

    for(let i=0;i<p.count;i+=3){
        const tri=[
            registerPoint(
                new THREE.Vector3(
                    p.getX(i),
                    p.getY(i),
                    p.getZ(i)
                )
            ),
            registerPoint(
                new THREE.Vector3(
                    p.getX(i+1),
                    p.getY(i+1),
                    p.getZ(i+1)
                )
            ),
            registerPoint(
                new THREE.Vector3(
                    p.getX(i+2),
                    p.getY(i+2),
                    p.getZ(i+2)
                )
            )
        ];

        // Right side is evaluated in native coordinates.
        const nativeCx =
            (
                p.getX(i) +
                p.getX(i+1) +
                p.getX(i+2)
            ) / 3;

        if(nativeCx >= 0)
            continue;

        const poly =
            clipPolygonY(
                tri,
                keepProximal
            );

        for(let k=1;k<poly.length-1;k++){
            const a=poly[0];
            const b=poly[k];
            const c=poly[k+1];

            vertices.push(
                a.x,a.y,a.z,
                b.x,b.y,b.z,
                c.x,c.y,c.z
            );
        }
    }

    const out =
        new THREE.BufferGeometry();

    out.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );

    out.computeVertexNormals();

    return out;
}

// ------------------------------------------------------------
// Planar cut cap.
//
// The cap is constructed in the y=0 plane from the clipped
// intersection points. A convex hull is used only for this
// visualization so the surface is guaranteed planar.
// ------------------------------------------------------------

function convexHull2D(points){
    const pts =
        points.map(p=>({
            x:p.x,
            z:p.z,
            p
        }))
        .sort((a,b)=>
            a.x-b.x || a.z-b.z
        );

    if(pts.length<=3)
        return pts.map(q=>q.p);

    const cross=(o,a,b)=>
        (a.x-o.x)*(b.z-o.z) -
        (a.z-o.z)*(b.x-o.x);

    const lower=[];
    for(const p of pts){
        while(
            lower.length>=2 &&
            cross(
                lower[lower.length-2],
                lower[lower.length-1],
                p
            ) <= 0
        )
            lower.pop();

        lower.push(p);
    }

    const upper=[];
    for(let i=pts.length-1;i>=0;i--){
        const p=pts[i];

        while(
            upper.length>=2 &&
            cross(
                upper[upper.length-2],
                upper[upper.length-1],
                p
            ) <= 0
        )
            upper.pop();

        upper.push(p);
    }

    upper.pop();
    lower.pop();

    return lower.concat(upper).map(q=>q.p);
}

function makePlanarCap(
    source
){
    const g =
        source.index
            ? source.toNonIndexed()
            : source;

    const p=g.attributes.position;
    const intersections=[];

    for(let i=0;i<p.count;i+=3){
        const native=[
            new THREE.Vector3(
                p.getX(i),
                p.getY(i),
                p.getZ(i)
            ),
            new THREE.Vector3(
                p.getX(i+1),
                p.getY(i+1),
                p.getZ(i+1)
            ),
            new THREE.Vector3(
                p.getX(i+2),
                p.getY(i+2),
                p.getZ(i+2)
            )
        ];

        const nativeCx =
            native.reduce((s,q)=>s+q.x,0)/3;

        if(nativeCx >= 0)
            continue;

        const q =
            native.map(registerPoint);

        for(let e=0;e<3;e++){
            const A=q[e];
            const B=q[(e+1)%3];

            if(
                (A.y < -1e-7 && B.y > 1e-7) ||
                (A.y > 1e-7 && B.y < -1e-7)
            ){
                const t=
                    -A.y/(B.y-A.y);

                intersections.push(
                    A.clone().lerp(B,t)
                );
            }
        }
    }

    const unique=[];

    for(const q of intersections){
        if(
            !unique.some(
                u=>u.distanceToSquared(q)<1e-8
            )
        )
            unique.push(q);
    }

    if(unique.length<3)
        return null;

    const hull=convexHull2D(unique);

    if(hull.length<3)
        return null;

    const verts=[];

    for(let i=1;i<hull.length-1;i++){
        verts.push(
            hull[0].x,0,hull[0].z,
            hull[i].x,0,hull[i].z,
            hull[i+1].x,0,hull[i+1].z
        );
    }

    const capGeometry =
        new THREE.BufferGeometry();

    capGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            verts,
            3
        )
    );

    capGeometry.computeVertexNormals();

    return new THREE.Mesh(
        capGeometry,
        new THREE.MeshStandardMaterial({
            color:0xd6d6d6,
            roughness:0.9,
            metalness:0,
            side:THREE.DoubleSide
        })
    );
}

function getFramePhaseNumber(frame){

    if(!frame) return null;

    const rawIndex =
        frame.phaseIndex ??
        (frame.phase && typeof frame.phase === "object"
            ? frame.phase.index
            : null);

    const index = Number(rawIndex);

    if(Number.isFinite(index)) return index + 1;

    const explicit = Number(
        frame.phaseNumber ??
        (frame.phase && typeof frame.phase === "object"
            ? frame.phase.number
            : null)
    );

    return Number.isFinite(explicit) ? explicit : null;

}


function getFramePhaseName(frame){

    if(!frame) return null;

    const name =
        frame.phaseName ??
        (frame.phase && typeof frame.phase === "object"
            ? (frame.phase.name ?? frame.phase.label)
            : null);

    return name ? String(name).trim() : null;

}

function getFrameDate(frame){

    if(!frame) return null;

    const value =
        frame.date ??
        frame.calendarDate ??
        frame.rowDate ??
        frame.treatmentDate ??
        frame.phaseDate ??
        null;

    if(!value) return null;

    const text = String(value).trim();

    if(!text) return null;

    const match =
        /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);

    if(match){

        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);

        const d = new Date(year, month - 1, day);

        if(
            d.getFullYear() === year &&
            d.getMonth() === month - 1 &&
            d.getDate() === day
        ){

            return d.toLocaleDateString("en-GB", {
                day:"2-digit",
                month:"short",
                year:"numeric"
            });

        }

    }

    return text;

}

function getPhaseNumberForFrame(frame){
    return getFramePhaseNumber(frame);

function getPhaseNameForDisplay(frame, number){

    const name = getFramePhaseName(frame);

    if(!name) return null;

    if(number !== null &&
       name.toLowerCase() === ("phase " + number).toLowerCase()){
        return null;
    }

    return name;

}

function getTimelinePhaseColor(phase, index){

    if(phase && phase.color) return String(phase.color);

    const palette = [
        "#4A90E2",

        "#F5A623",
        "#E45C5C",
        "#00A6A6",
        "#7B61A8",
        "#D97706"
    ];

    return palette[index % palette.length];

}

function updateTreatmentTimeline(){

    if(!timelineTrack) return;

    timelineTrack.innerHTML = "";

    if(!Array.isArray(frames) || frames.length === 0){
        return;
    }

    const phases =
        Array.isArray(frameContract?.treatment?.phases)
            ? frameContract.treatment.phases
            : [];

    const counts = [];

    if(phases.length){

        for(let i = 0; i < phases.length; i++){
            counts.push({ phase: phases[i], count: 0 });
        }

        frames.forEach(frame => {

            const index = Number(frame.phaseIndex);

            if(Number.isFinite(index) && counts[index]){
                counts[index].count += 1;
            }

        });

    }

    else{

        const groups = new Map();

        frames.forEach(frame => {
            const key = String(frame.phaseId ?? frame.phaseIndex ?? "phase-0");
            if(!groups.has(key)){
                groups.set(key, {
                    phase: {
                        index: Number(frame.phaseIndex) || 0,
                        id: frame.phaseId ?? null,
                        name: frame.phaseName ?? null
                    },
                    count: 0
                });
            }
            groups.get(key).count += 1;
        });

        groups.forEach(value => counts.push(value));

    }

    const total =
        counts.reduce((sum, item) => sum + item.count, 0);

    if(total <= 0) return;

    let offset = 0;

    counts.forEach((item, index) => {

        if(item.count <= 0) return;

        const segment = document.createElement("div");
        segment.className = "timelineSegment";
        segment.style.left = (offset / total * 100) + "%";
        segment.style.width = (item.count / total * 100) + "%";
        segment.style.background = getTimelinePhaseColor(item.phase, index);
        segment.title =
            "Phase " + (Number(item.phase?.index) + 1) +
            " — " + (item.phase?.name || "") +
            " (" + item.count + " days)";
        timelineTrack.appendChild(segment);

        offset += item.count;

    });

}

            ? frameContract.treatment.phases

function showDay(

    // --------------------------------------------------------

function loadCurrentSimulationFrame(preserveDay = Number(daySlider.value)){

    const latestJSON = localStorage.getItem("simulationFrameV1");

    if(!latestJSON){

        status.textContent =
            "NO SimulationFrameV1 FOUND\n\n" +
            "Run Update Adjustment Plan first.";

        return false;

    }

    let latestContract;

    try{
        latestContract = JSON.parse(latestJSON);
    }catch(error){

        status.textContent =
            "INVALID SimulationFrameV1\n\n" +
            "Could not parse localStorage data.";

        return false;

    }

    if(
        !latestContract ||
        latestContract.contract !== "SimulationFrameV1" ||
        !Array.isArray(latestContract.days) ||
        latestContract.days.length === 0
    ){

        status.textContent =
            "INVALID SimulationFrameV1\n\n" +
            "No valid daily frames found.";

        return false;

    }

    frameContract = latestContract;
    frames = latestContract.days;
    totalDays = frames.length - 1;

    // Rebuild all six trajectories from the newly published daily frames.
    // showDay() refreshes values and the selected-day markers afterward.
    clinicalProgressChartsBuilt = false;

    const requestedDay = Number.isFinite(Number(preserveDay))
        ? Number(preserveDay)
        : 0;

    const safeDay = Math.max(
        0,
        Math.min(requestedDay, totalDays)
    );

    daySlider.max = String(totalDays);
    daySlider.value = String(safeDay);

    updateTreatmentTimeline();
    showDay(safeDay);

    return true;

}

// Refresh the existing viewer in place, retaining the current day and all
// camera/display controls. Reject messages from other origins.
window.addEventListener("message", function(event){
    if(event.origin !== window.location.origin) return;
    if(!event.data) return;

    if(event.data.type === "threePrototypePause"){
        if(playing) stopPlayback();
        pausedDay = null;
        return;
    }

    if(event.data.type !== "simulationFrameV1Updated") return;

    const preserveDay = Number(daySlider.value);
    if(playing) stopPlayback();
    pausedDay = null;

    if(loadCurrentSimulationFrame(preserveDay)){
        status.textContent = "Three.js ready · treatment data updated · Day " +
            Number(daySlider.value) + " / " + totalDays;
    }
});

// TEST 50 — TRUE REGISTERED SECTION DIAGNOSTIC
// ============================================================
// The diagnostic now uses the same true triangle/plane section
// method as the anatomical-axis construction.  Therefore the
// displayed orange/cyan/yellow markers are based on actual STL
// cortical intersections, not vertices sampled inside a slab.
// ============================================================

const tibiaRightTrianglesRegistered =
    tibiaRightTriangles.map(tri =>
        tri.map(p => registerPoint(p))
    );

const test50P1Axis=registerPoint(proximalAxisPoint);
const test50P2Axis=registerPoint(distalAxisPoint);

function intersectTriangleWithYPlane(tri,yLevel){
    const hits=[];
    const eps=1e-9;

    for(let e=0;e<3;e++){
        const A=tri[e];
        const B=tri[(e+1)%3];
        const da=A.y-yLevel;
        const db=B.y-yLevel;

        if(Math.abs(da)<=eps && Math.abs(db)<=eps){
            hits.push(A.clone(),B.clone());
        }else if(Math.abs(da)<=eps){
            hits.push(A.clone());
        }else if(Math.abs(db)<=eps){
            hits.push(B.clone());
        }else if(da*db<0){
            const t=da/(da-db);
            hits.push(A.clone().lerp(B,t));
        }
    }

    const unique=[];
    for(const q of hits){
        if(!unique.some(r=>r.distanceToSquared(q)<1e-12))
            unique.push(q);
    }
    return unique;
}

function trueRegisteredSectionAtY(yLevel){
    const section=[];

    for(const tri of tibiaRightTrianglesRegistered){
        for(const q of intersectTriangleWithYPlane(tri,yLevel))
            section.push(q);
    }

    if(section.length<3)
        throw new Error("Insufficient true registered section intersections at Y="+yLevel);

    let minX=Infinity,maxX=-Infinity;
    let minZ=Infinity,maxZ=-Infinity;

    for(const p of section){
        minX=Math.min(minX,p.x);
        maxX=Math.max(maxX,p.x);
        minZ=Math.min(minZ,p.z);
        maxZ=Math.max(maxZ,p.z);
    }

    return {
        y:yLevel,
        minX,maxX,minZ,maxZ,
        centerX:(minX+maxX)/2,
        centerZ:(minZ+maxZ)/2,
        count:section.length
    };
}

const CLINICAL_PROGRESS_METRICS = [

    {key:"ap_angulation", label:"AP angulation", suffix:"°"},
    {key:"lat_translation", label:"LAT translation", suffix:" mm"},
    {key:"lat_angulation", label:"LAT angulation", suffix:"°"},

    {key:"bone_rotation", label:"Bone rotation", suffix:"°"}
];

let clinicalProgressChartsBuilt = false;
let clinicalProgressDrag = null;

function clinicalProgressFormatValue(frame, metric){
    const metrics =
        frame &&
        frame.clinicalMetrics &&
        typeof frame.clinicalMetrics === "object"
            ? frame.clinicalMetrics
            : null;

    const directions =
        frame &&
        frame.clinicalDirections &&
        typeof frame.clinicalDirections === "object"
            ? frame.clinicalDirections

    if(!Number.isFinite(value)){

    // R1172.9.24: show magnitude only; clinical direction remains a

    const result = Math.abs(value).toFixed(2) + metric.suffix;

    const direction = directions
        ? String(directions[metric.key] || "").trim()
        : "";

}

function clinicalProgressFormatResidual(frame, metric){
    const targets = frame && frame.clinicalTargets && typeof frame.clinicalTargets === "object" ? frame.clinicalTargets : null;
    const metrics = frame && frame.clinicalMetrics && typeof frame.clinicalMetrics === "object" ? frame.clinicalMetrics : null;
    if(!targets || !metrics || !Number.isFinite(Number(targets[metric.key]))) return "N/A";
    const current = Number(metrics[metric.key]);
    if(!Number.isFinite(current)) return "—";
    const residual = Number(targets[metric.key]) - current;
    return (residual > 0 ? "+" : "") + residual.toFixed(2) + (metric.suffix ? " " + metric.suffix.trim() : "");
}

function clinicalProgressBuildTrajectory(metric){
    if(!clinicalProgressCharts || !Array.isArray(frames) || !frames.length){
        return null;
    }

    const W = 248;
    const H = 27;
    const padX = 2;
    const padY = 3;

    const values = frames.map(function(frame){
        const metrics =
            frame &&
            frame.clinicalMetrics &&
            typeof frame.clinicalMetrics === "object"
                ? frame.clinicalMetrics
                : null;
        const value = metrics ? Number(metrics[metric.key]) : NaN;
        return Number.isFinite(value) ? value : null;
    });

    const valid = values.filter(function(v){ return v !== null; });

    if(!valid.length){
        return null;
    }

    let min = Math.min.apply(null, valid);
    let max = Math.max.apply(null, valid);

    // Keep zero inside the chart range for the correction reference.
    min = Math.min(min, 0);
    max = Math.max(max, 0);

    if(min === max){
        const extra = Math.max(1, Math.abs(min) * 0.15);
        min -= extra;
        max += extra;
    }else{
        const extra = (max - min) * 0.10;
        min -= extra;
        max += extra;
    }

    function xFor(i){
        if(values.length <= 1) return W / 2;
        return padX + (i / (values.length - 1)) * (W - padX * 2);
    }

    function yFor(v){
        return H - padY -
            ((v - min) / (max - min)) * (H - padY * 2);
    }

    const points = [];
    let firstValid = -1;
    let lastValid = -1;

    values.forEach(function(v, i){
        if(v === null) return;
        if(firstValid < 0) firstValid = i;
        lastValid = i;
        points.push(xFor(i).toFixed(2) + "," + yFor(v).toFixed(2));
    });

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "clinicalMetricChart");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("aria-hidden", "true");

    const zeroLine = document.createElementNS(svgNS, "line");
    zeroLine.setAttribute("class", "clinicalMetricZeroLine");
    zeroLine.setAttribute("x1", padX);
    zeroLine.setAttribute("x2", W - padX);
    zeroLine.setAttribute("y1", yFor(0));
    zeroLine.setAttribute("y2", yFor(0));
    svg.appendChild(zeroLine);

    // Draw the actual daily trajectory in phase-colored segments.
    // The data points remain unchanged; only presentation is segmented by phase.
    const phaseRuns = [];
    let runStart = firstValid;
    let runPhase = null;

    for(let i = firstValid; i <= lastValid; i++){
        if(values[i] === null) continue;

        const frame = frames[i];
        const phaseIndex =
            frame && Number.isFinite(Number(frame.phaseIndex))
                ? Number(frame.phaseIndex)
                : 0;

        if(runPhase === null){
            runPhase = phaseIndex;
            runStart = i;
        }else if(phaseIndex !== runPhase){
            phaseRuns.push({
                start:runStart,
                end:i - 1,
                phase:runPhase
            });
            runStart = i;
            runPhase = phaseIndex;
        }
    }

    if(runPhase !== null){
        phaseRuns.push({
            start:runStart,
            end:lastValid,
            phase:runPhase
        });
    }

    phaseRuns.forEach(function(run){
        const segmentPoints = [];

        // Include one point before the phase boundary when available,
        // so adjacent colored segments meet without a visual gap.
        const start = Math.max(firstValid, run.start - 1);
        for(let i = start; i <= run.end; i++){
            if(values[i] === null) continue;
            segmentPoints.push(
                xFor(i).toFixed(2) + "," + yFor(values[i]).toFixed(2)
            );
        }

        if(segmentPoints.length < 2) return;

        const path = document.createElementNS(svgNS, "polyline");
        path.setAttribute("class", "clinicalMetricTrajectory");
        path.setAttribute("points", segmentPoints.join(" "));
        path.style.stroke =
            CLINICAL_PHASE_COLORS[
                ((run.phase % CLINICAL_PHASE_COLORS.length) +
                 CLINICAL_PHASE_COLORS.length) %
                CLINICAL_PHASE_COLORS.length
            ];
        svg.appendChild(path);
    });

    const dot = document.createElementNS(svgNS, "circle");
    dot.setAttribute("class", "clinicalMetricDot");
    dot.setAttribute("r", "3.8");
    dot.setAttribute("cx", xFor(firstValid));
    dot.setAttribute("cy", yFor(values[firstValid]));
    svg.appendChild(dot);

    return {
        svg:svg,
        dot:dot,
        values:values,
        xFor:xFor,
        yFor:yFor
    };
}

const CLINICAL_METRIC_TOLERANCE = {
    ap_translation: 1.0,
    lat_translation: 1.0,
    bone_length: 1.0,
    ap_angulation: 0.5,
    lat_angulation: 0.5,
    bone_rotation: 0.5
};

function clinicalProgressApplyTolerance(frame, metric, valueEl, residualEl){
    if(valueEl){
        valueEl.classList.remove("is-within-tolerance", "is-outside-tolerance");
        valueEl.style.color = "#111";
    }
    if(residualEl){
        residualEl.classList.remove("is-within-tolerance", "is-outside-tolerance");
        residualEl.style.color = "#222";
    }
    const targets = frame && frame.clinicalTargets;
    const metrics = frame && frame.clinicalMetrics;
    if(!targets || !metrics || !Number.isFinite(Number(targets[metric.key]))) return;
    const current = Number(metrics[metric.key]);
    const target = Number(targets[metric.key]);
    if(!Number.isFinite(current) || !Number.isFinite(target)) return;
    const tolerance = CLINICAL_METRIC_TOLERANCE[metric.key];
    const within = Math.abs(target - current) <= tolerance + 1e-9;
    const cls = within ? "is-within-tolerance" : "is-outside-tolerance";
    if(residualEl){
        residualEl.classList.add(cls);
        // Existing R1172.9.19 color behavior is observed, not modified by this diagnostic build.
        // Inline color avoids inherited/competing styles in embedded layouts.
        residualEl.style.color = within ? "#16833B" : "#C62828";
    }
}

function clinicalProgressBuildMovementTrajectory(kind){
    if(!Array.isArray(frames) || !frames.length) return null;
    const keys = kind === "mm"
        ? ["ap_translation", "lat_translation", "bone_length"]
        : ["ap_angulation", "lat_angulation", "bone_rotation"];
    const limit = 1.0;
    const values = frames.map(function(frame, index){
        if(index === 0) return 0;
        const previous = frames[index - 1];
        const currentMetrics = frame && frame.clinicalMetrics;
        const previousMetrics = previous && previous.clinicalMetrics;
        if(!currentMetrics || !previousMetrics) return null;
        const deltas = keys.map(function(key){
            const a = Number(currentMetrics[key]);
            const b = Number(previousMetrics[key]);
            return Number.isFinite(a) && Number.isFinite(b) ? Math.abs(a - b) : null;
        }).filter(function(v){ return v !== null; });
        return deltas.length ? Math.max.apply(null, deltas) : null;
    });
    const valid = values.filter(function(v){ return v !== null; });
    if(!valid.length) return null;
    const maxValue = Math.max(limit, ...valid) * 1.12;
    const W = 248, H = 34, padX = 2, padY = 3;
    const xFor = function(i){ return values.length <= 1 ? W/2 : padX + i/(values.length-1)*(W-2*padX); };
    const yFor = function(v){ return H-padY-(v/maxValue)*(H-2*padY); };
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS,"svg");
    svg.setAttribute("class","clinicalMovementChart");
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    svg.setAttribute("preserveAspectRatio","none");
    const limitLine = document.createElementNS(svgNS,"line");
    limitLine.setAttribute("class","clinicalMovementLimit");
    limitLine.setAttribute("x1",padX); limitLine.setAttribute("x2",W-padX);
    limitLine.setAttribute("y1",yFor(limit)); limitLine.setAttribute("y2",yFor(limit));
    svg.appendChild(limitLine);
    const pts=[];
    values.forEach(function(v,i){ if(v!==null) pts.push(`${xFor(i).toFixed(2)},${yFor(v).toFixed(2)}`); });
    if(pts.length>1){
        const path=document.createElementNS(svgNS,"polyline");
        path.setAttribute("class","clinicalMovementLine");
        path.setAttribute("points",pts.join(" "));
        svg.appendChild(path);
    }
    const dot=document.createElementNS(svgNS,"circle");
    dot.setAttribute("class","clinicalMovementDot"); dot.setAttribute("r","3");
    dot.setAttribute("cx",xFor(0)); dot.setAttribute("cy",yFor(values[0] || 0));
    svg.appendChild(dot);
    return {svg,dot,values,xFor,yFor,limit};
}

function clinicalProgressBuildMovementPanels(){
    if(!clinicalMovementCharts) return;
    clinicalMovementCharts.innerHTML="";
    [
        {kind:"mm",title:"Translation movement"},
        {kind:"deg",title:"Rotation movement"}
    ].forEach(function(item){
        const card=document.createElement("div");
        card.className="clinicalMovementCard";
        const title=document.createElement("div");
        title.className="clinicalMovementTitle";
        const label=document.createElement("span");
        label.textContent=item.kind==="mm"?"Translation Limit 1.00 mm":"Rotation Limit 1.00°";
        const current=document.createElement("span");
        current.className="clinicalMovementCurrent";
        current.textContent="—";
        title.appendChild(label);
        title.appendChild(current);
        card.appendChild(title);
        const trajectory=clinicalProgressBuildMovementTrajectory(item.kind);
        if(trajectory){
            card.appendChild(trajectory.svg);
            card._clinicalMovement=trajectory;
            card._clinicalMovementCurrent=current;
            card._clinicalMovementUnit=item.kind==="mm"?"mm":"°";
        }
        clinicalMovementCharts.appendChild(card);
    });
}

function clinicalProgressBuildPanel(){
    if(!clinicalProgressCharts) return;

    clinicalProgressCharts.innerHTML = "";
    clinicalProgressChartsBuilt = false;

    CLINICAL_PROGRESS_METRICS.forEach(function(metric){
        const card = document.createElement("div");
        card.className = "clinicalMetricCard";
        card.dataset.metricKey = metric.key;

        const label = document.createElement("div");
        label.className = "clinicalMetricLabel";
        label.textContent = metric.label;

        const valueRow = document.createElement("div");
        valueRow.className = "clinicalMetricValueRow";

        const value = document.createElement("div");
        value.className = "clinicalMetricValue";
        value.id = "clinicalValue_" + metric.key;

        const residual = document.createElement("div");
        residual.className = "clinicalMetricResidual";
        residual.id = "clinicalResidual_" + metric.key;
        residual.textContent = "N/A";

        valueRow.appendChild(value);
        valueRow.appendChild(residual);
        card.appendChild(label);
        card.appendChild(valueRow);

        const trajectory = clinicalProgressBuildTrajectory(metric);
        if(trajectory){
            card.appendChild(trajectory.svg);
            card._clinicalTrajectory = trajectory;
        }

        clinicalProgressCharts.appendChild(card);
    });

    clinicalProgressBuildMovementPanels();
    clinicalProgressChartsBuilt = true;
}

function updateClinicalProgressPanel(frame, day){
    if(!clinicalProgressChartsBuilt){
        clinicalProgressBuildPanel();
    }

    if(!clinicalProgressCharts) return;

    const safeDay = Math.max(
        0,
        Math.min(
            Number(day) || 0,
            Math.max(0, frames.length - 1)
        )
    );

    CLINICAL_PROGRESS_METRICS.forEach(function(metric){
        const card =
            clinicalProgressCharts.querySelector(
                '[data-metric-key="' + metric.key + '"]'
            );

        if(!card) return;

        const valueEl =
            card.querySelector(".clinicalMetricValue");

        if(valueEl){
            valueEl.textContent = clinicalProgressFormatValue(frame, metric);
        }

        const residualEl = card.querySelector(".clinicalMetricResidual");
        if(residualEl){
            residualEl.textContent = clinicalProgressFormatResidual(frame, metric);
        }
        clinicalProgressApplyTolerance(frame, metric, valueEl, residualEl);

        const trajectory = card._clinicalTrajectory;
        if(!trajectory) return;

        const value = trajectory.values[safeDay];

        if(value === null || !Number.isFinite(value)){
            trajectory.dot.style.display = "none";
            return;
        }

        trajectory.dot.style.display = "block";
        trajectory.dot.setAttribute(
            "cx",
            trajectory.xFor(safeDay)
        );
        trajectory.dot.setAttribute(
            "cy",
            trajectory.yFor(value)
        );
    });

    if(clinicalMovementCharts){
        Array.from(clinicalMovementCharts.children).forEach(function(card){
            const trajectory=card._clinicalMovement;
            if(!trajectory) return;
            const value=trajectory.values[safeDay];
            if(value===null || !Number.isFinite(value)){
                trajectory.dot.style.display="none";
                if(card._clinicalMovementCurrent){
                    card._clinicalMovementCurrent.textContent="—";
                    card._clinicalMovementCurrent.classList.remove("is-within-limit", "is-over-limit");
                }
                return;
            }
            trajectory.dot.style.display="block";
            trajectory.dot.setAttribute("cx",trajectory.xFor(safeDay));
            trajectory.dot.setAttribute("cy",trajectory.yFor(value));
            if(card._clinicalMovementCurrent){
                const overLimit = value > trajectory.limit + 1e-9;
                card._clinicalMovementCurrent.textContent=value.toFixed(2)+" "+(card._clinicalMovementUnit || "");
                card._clinicalMovementCurrent.classList.toggle("is-over-limit", overLimit);
                card._clinicalMovementCurrent.classList.toggle("is-within-limit", !overLimit);
            }
        });
    }
}

function setClinicalProgressVisible(visible){
    if(!clinicalProgressPanel) return;

    if(visible){
        clinicalProgressPanel.style.display = "block";
        clinicalProgressBuildPanel();

        const currentDay =
            Number(daySlider.value) || 0;

        const currentFrame = frames[currentDay];
        if(currentFrame){
            updateClinicalProgressPanel(currentFrame, currentDay);
        }

        clinicalProgressButton.classList.add("active");
        clinicalProgressButton.setAttribute("aria-pressed", "true");
    }else{
        clinicalProgressPanel.style.display = "none";
        clinicalProgressButton.classList.remove("active");
        clinicalProgressButton.setAttribute("aria-pressed", "false");
    }
}

clinicalProgressButton.addEventListener("pointerdown", function(event){
    event.stopPropagation();
});

clinicalProgressButton.addEventListener("click", function(event){
    event.preventDefault();
    event.stopPropagation();

    const visible =
        getComputedStyle(clinicalProgressPanel).display !== "none";



    setClinicalProgressVisible(!visible);
});

clinicalProgressTitle.addEventListener("pointerdown", function(event){
    event.preventDefault();
    event.stopPropagation();

    const rect =
        clinicalProgressPanel.getBoundingClientRect();

    clinicalProgressDrag = {
        pointerId:event.pointerId,
        offsetX:event.clientX - rect.left,
        offsetY:event.clientY - rect.top
    };

    try{
        clinicalProgressTitle.setPointerCapture(event.pointerId);
    }catch(_){}
});

clinicalProgressTitle.addEventListener("pointermove", function(event){
    if(
        !clinicalProgressDrag ||
        event.pointerId !== clinicalProgressDrag.pointerId
    ){
        return;
    }

    event.preventDefault();
    event.stopPropagation();

    const viewerEl = document.getElementById("viewer");
    const viewerRect = viewerEl.getBoundingClientRect();

    let left =
        event.clientX -
        viewerRect.left -
        clinicalProgressDrag.offsetX;

    let top =
        event.clientY -
        viewerRect.top -
        clinicalProgressDrag.offsetY;

    left = Math.max(
        4,
        Math.min(
            left,
            viewerRect.width -
            clinicalProgressPanel.offsetWidth -
            4
        )
    );

    top = Math.max(
        4,
        Math.min(
            top,
            viewerRect.height -
            clinicalProgressPanel.offsetHeight -
            4
        )
    );

    clinicalProgressPanel.style.left = left + "px";
    clinicalProgressPanel.style.top = top + "px";
});

function endClinicalProgressDrag(event){
    if(
        !clinicalProgressDrag ||
        event.pointerId !== clinicalProgressDrag.pointerId
    ){
        return;
    }

    try{
        clinicalProgressTitle.releasePointerCapture(event.pointerId);
    }catch(_){}

    clinicalProgressDrag = null;
}

clinicalProgressTitle.addEventListener(
    "pointerup",
    endClinicalProgressDrag
);

clinicalProgressTitle.addEventListener(
    "pointercancel",
    endClinicalProgressDrag
);

// ============================================================
// TEST 96 — DISPLAY COLLAPSE + DRAG + PORTRAIT SAFETY
//
// The Display title remains the drag handle.
// A click without movement collapses/expands the panel.
// A drag moves it.
// ============================================================

const displayControl =
    document.getElementById("viewControls");

const displayControlTitle =
    document.getElementById("displayControlTitle");

const displayCollapseButton =
    document.getElementById("displayCollapseButton");

let displayDragging = false;
let displayMoved = false;
let displayOffsetX = 0;
let displayOffsetY = 0;
let displayStartX = 0;
let displayStartY = 0;

function toggleDisplayCollapsed(){

    displayControl.classList.toggle("collapsed");

    const collapsed =
        displayControl.classList.contains("collapsed");

    displayCollapseButton.textContent =
        collapsed ? "+" : "−";

    displayCollapseButton.setAttribute(
        "aria-label",
        collapsed
            ? "Expand display controls"
            : "Collapse display controls"
    );

    setTimeout(
        clampDisplayControlToViewer,
        0
    );

}

function beginDisplayDrag(clientX, clientY){

    const viewerRect =
        viewer.getBoundingClientRect();

    const panelRect =
        displayControl.getBoundingClientRect();

    displayControl.style.right = "auto";
    displayControl.style.bottom = "auto";

    displayControl.style.left =
        (panelRect.left - viewerRect.left) + "px";

    displayControl.style.top =
        (panelRect.top - viewerRect.top) + "px";

    displayOffsetX =
        clientX - panelRect.left;

    displayOffsetY =
        clientY - panelRect.top;

    displayStartX = clientX;
    displayStartY = clientY;
    displayMoved = false;
    displayDragging = true;

}

function moveDisplayDrag(clientX, clientY){

    if(!displayDragging) return;

    if(
        Math.abs(clientX - displayStartX) > 4 ||
        Math.abs(clientY - displayStartY) > 4
    ){
        displayMoved = true;
    }

    if(!displayMoved) return;

    const viewerRect =
        viewer.getBoundingClientRect();

    let left =
        clientX -
        viewerRect.left -
        displayOffsetX;

    let top =
        clientY -
        viewerRect.top -
        displayOffsetY;

    const maxLeft =
        Math.max(
            0,
            viewer.clientWidth -
            displayControl.offsetWidth
        );

    const maxTop =
        Math.max(
            0,
            viewer.clientHeight -
            displayControl.offsetHeight
        );

    left = Math.max(0, Math.min(left,maxLeft));
    top = Math.max(0, Math.min(top,maxTop));

    displayControl.style.left = left + "px";
    displayControl.style.top = top + "px";

}

function endDisplayDrag(){

    if(!displayDragging) return;

    const shouldToggle =
        !displayMoved;

    displayDragging = false;

    if(shouldToggle){
        toggleDisplayCollapsed();
    }

}

displayControlTitle.addEventListener(
    "mousedown",
    function(event){

        if(event.target === displayCollapseButton){
            return;
        }

        beginDisplayDrag(
            event.clientX,
            event.clientY
        );

        event.preventDefault();

    }
);

document.addEventListener(
    "mousemove",
    function(event){
        moveDisplayDrag(
            event.clientX,
            event.clientY
        );
    }
);

document.addEventListener(
    "mouseup",
    endDisplayDrag
);

displayControlTitle.addEventListener(
    "touchstart",
    function(event){

        if(!event.touches.length) return;

        if(event.target === displayCollapseButton){
            return;
        }

        beginDisplayDrag(
            event.touches[0].clientX,
            event.touches[0].clientY
        );

        event.preventDefault();

    },
    {passive:false}
);

document.addEventListener(
    "touchmove",
    function(event){

        if(!displayDragging || !event.touches.length)
            return;

        moveDisplayDrag(
            event.touches[0].clientX,
            event.touches[0].clientY
        );

        if(displayMoved)
            event.preventDefault();

    },
    {passive:false}
);

document.addEventListener(
    "touchend",
    endDisplayDrag
);

displayCollapseButton.addEventListener(
    "click",
    function(event){
        event.stopPropagation();
        toggleDisplayCollapsed();
    }
);

// PORTRAIT / RESIZE SAFETY
// ------------------------------------------------------------

function clampDisplayControlToViewer(){

    const viewerRect = viewer.getBoundingClientRect();
    const panelRect = displayControl.getBoundingClientRect();

    let left = panelRect.left - viewerRect.left;
    let top = panelRect.top - viewerRect.top;

    const maxLeft =
        Math.max(
            0,
            viewer.clientWidth -
            displayControl.offsetWidth
        );

    const maxTop =
        Math.max(
            0,
            viewer.clientHeight -
            displayControl.offsetHeight
        );

    displayControl.style.right = "auto";
    displayControl.style.bottom = "auto";

    displayControl.style.left =
        Math.max(0, Math.min(left, maxLeft)) + "px";

    displayControl.style.top =
        Math.max(0, Math.min(top, maxTop)) + "px";

}

window.addEventListener(
    "resize",
    clampDisplayControlToViewer
);

        setTimeout(

            100

    }
);

                50
            );
        }
    );

}

// ============================================================
// TEST 111 — FIXED-CAMERA 2D PAN
//
// PAN changes only the screen location of the rendered canvas.
// The Three.js camera is never translated or retargeted by PAN.
// This preserves the exact rendered view while the complete visual
// construct follows mouse/finger movement.
// ============================================================

const panCanvas = renderer.domElement;
panCanvas.style.touchAction = "none";
panCanvas.style.transformOrigin = "0 0";

let panActive = false;
let panPointerId = null;
let panLastX = 0;
let panLastY = 0;
let screenPanX = 0;
let screenPanY = 0;

function panCanvasTransform(){
    panCanvas.style.transform =
        "translate(" + screenPanX + "px," + screenPanY + "px)";
}

function beginScenePan(e){
    if(e.pointerType === "mouse" && e.button !== 0) return;
    panActive = true;
    panPointerId = e.pointerId;
    panLastX = e.clientX;
    panLastY = e.clientY;
    if(panCanvas.setPointerCapture){
        try{ panCanvas.setPointerCapture(e.pointerId); }catch(_){}
    }
    e.preventDefault();
}

function moveScenePan(e){
    if(!panActive || e.pointerId !== panPointerId) return;
    screenPanX += e.clientX - panLastX;
    screenPanY += e.clientY - panLastY;
    panLastX = e.clientX;
    panLastY = e.clientY;
    panCanvasTransform();
    e.preventDefault();
}

function endScenePan(e){
    if(!panActive || (e && e.pointerId !== panPointerId)) return;
    panActive = false;
    panPointerId = null;
    if(e && panCanvas.releasePointerCapture){
        try{ panCanvas.releasePointerCapture(e.pointerId); }catch(_){}
    }
}

panCanvas.addEventListener("pointerdown", beginScenePan, {passive:false});
panCanvas.addEventListener("pointermove", moveScenePan, {passive:false});
panCanvas.addEventListener("pointerup", endScenePan, {passive:false});
panCanvas.addEventListener("pointercancel", endScenePan, {passive:false});
