<input id="phase_ap_translation_value" class="numberField" type="number">

<div class="mountingGuide">??</div>
</div>

</div>

<label><input id="phase_lat_angulation_posterior" type="radio" name="phase_lat_angulation_direction" value="posterior"><span>Posterior</span></label>
<div class="mountingGuide">??</div>
</div>

</div>
